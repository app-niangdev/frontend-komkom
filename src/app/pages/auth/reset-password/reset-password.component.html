<div class="auth-form">
  <p class="auth-form__eyebrow">Récupération</p>
  <h2 class="auth-form__title">Nouveau mot de passe</h2>
  <p class="auth-form__desc">Choisissez un nouveau mot de passe pour votre compte.</p>

  <div class="alert alert--error" *ngIf="errorMessage()">{{ errorMessage() }}</div>

  <form (ngSubmit)="onSubmit()">
    <div class="field">
      <label class="field__label" for="password">Nouveau mot de passe</label>
      <input
        id="password"
        type="password"
        name="password"
        class="field__input"
        placeholder="••••••••"
        [(ngModel)]="password"
        autocomplete="new-password"
        minlength="6"
        required
      />
    </div>

    <div class="field">
      <label class="field__label" for="passwordConfirmation">Confirmer le mot de passe</label>
      <input
        id="passwordConfirmation"
        type="password"
        name="passwordConfirmation"
        class="field__input"
        placeholder="••••••••"
        [(ngModel)]="passwordConfirmation"
        autocomplete="new-password"
        minlength="6"
        required
      />
    </div>

    <button type="submit" class="btn-primary" [disabled]="isSubmitting()">
      {{ isSubmitting() ? 'Enregistrement...' : 'Réinitialiser le mot de passe' }}
    </button>
  </form>

  <a routerLink="/auth/login" class="back-link">
    <i class="bi bi-arrow-left"></i>
    Retour à la connexion
  </a>
</div>
