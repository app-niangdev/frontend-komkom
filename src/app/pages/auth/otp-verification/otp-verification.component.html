<div class="auth-form">
  <p class="auth-form__eyebrow">Sécurité</p>
  <h2 class="auth-form__title">Vérification en deux étapes</h2>
  <p class="auth-form__desc">
    Saisissez le code à 6 chiffres envoyé à votre adresse e-mail.
  </p>

  <div class="alert alert--error" *ngIf="errorMessage()" role="alert">{{ errorMessage() }}</div>

  <form (ngSubmit)="onSubmit()">
    <div class="otp" (paste)="onPaste($event)">
      <!-- Boucle sur des positions fixes : les champs ne sont jamais recréés pendant la saisie -->
      <input
        *ngFor="let i of positions; trackBy: trackPosition"
        #digitInput
        type="text"
        inputmode="numeric"
        [attr.maxlength]="i === 0 ? length : 1"
        class="otp__cell"
        [value]="digits()[i]"
        [attr.aria-label]="'Chiffre ' + (i + 1)"
        (input)="onDigitInput(i, $event)"
        (keydown)="onKeyDown(i, $event)"
        (focus)="$any($event.target).select()"
        [attr.autocomplete]="i === 0 ? 'one-time-code' : 'off'"
      />
    </div>

    <div class="notice">
      <i class="bi bi-shield-check"></i>
      <span>Ne partagez jamais ce code. Il expire dans quelques minutes.</span>
    </div>

    <button type="submit" class="btn-primary" [disabled]="!isComplete() || isSubmitting()">
      {{ isSubmitting() ? 'Vérification...' : 'Vérifier le code' }}
    </button>
  </form>

  <p class="resend">
    <ng-container *ngIf="!canResend()">
      Renvoyer le code dans <strong>{{ formattedTimer() }}</strong>
    </ng-container>
    <button *ngIf="canResend()" type="button" class="resend__btn" (click)="onResend()">
      Renvoyer le code
    </button>
  </p>

  <a routerLink="/auth/login" class="back-link">
    <i class="bi bi-arrow-left"></i>
    Retour à la connexion
  </a>
</div>
