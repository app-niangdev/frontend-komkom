<div class="auth-form">
  <p class="auth-form__eyebrow">Récupération</p>
  <h2 class="auth-form__title">Mot de passe oublié</h2>
  <p class="auth-form__desc">
    Indiquez l'adresse e-mail associée à votre compte et nous vous enverrons un lien de réinitialisation.
  </p>

  <div class="alert alert--error" *ngIf="errorMessage()">{{ errorMessage() }}</div>

  <form (ngSubmit)="onSubmit()">
    <div class="field">
      <label class="field__label" for="email">Adresse e-mail</label>
      <input
        id="email"
        type="email"
        name="email"
        class="field__input"
        placeholder="vous@entreprise.com"
        [(ngModel)]="email"
        autocomplete="email"
        required
      />
    </div>

    <button type="submit" class="btn-primary" [disabled]="isSubmitting()">
      {{ isSubmitting() ? 'Envoi...' : 'Envoyer le code' }}
    </button>
  </form>

  <a routerLink="/auth/login" class="back-link">
    <i class="bi bi-arrow-left"></i>
    Retour à la connexion
  </a>
</div>
