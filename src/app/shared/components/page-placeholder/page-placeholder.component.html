<div class="page-header card">
  <span class="page-header__icon"><i class="bi" [class]="pageInfo.icon"></i></span>
  <div>
    <h2 class="page-header__title">{{ pageInfo.title }}</h2>
    <p class="page-header__desc">{{ pageInfo.description }}</p>
  </div>
</div>

<div class="page-grid">
  <div class="card page-block">
    <p class="page-block__label">Zone de contenu</p>
    <p class="page-block__text">Emplacement prêt pour vos tableaux, listes et formulaires.</p>
  </div>

  <div class="card page-block">
    <p class="page-block__label">Statistiques</p>
    <p class="page-block__text">Emplacement prêt pour vos indicateurs et graphiques.</p>
  </div>
</div>
