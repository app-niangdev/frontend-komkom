server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Angular gère son propre routing côté client (Router) — toute route
    # inconnue de Nginx doit retomber sur index.html, sinon un rafraîchissement
    # de page sur une route Angular (ex. /dashboard) renvoie un 404 Nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Mise en cache longue des assets versionnés (Angular ajoute un hash
    # au nom de fichier à chaque build), sans risque de servir une version
    # périmée après un déploiement.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # index.html ne doit jamais être mis en cache par le navigateur,
    # sinon les utilisateurs restent bloqués sur une ancienne version
    # de l'app après un déploiement.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
